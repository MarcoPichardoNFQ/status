name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Modificar JSON
        run: python scripts/1.py

      - name: Modificar JSON2
        run: python scripts/2.py

      - name: Build
        run: npm run build

      - name: Deploy
        run: npm run deploy
